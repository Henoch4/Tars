# Fixed, human-reviewed profile allowlist for the curator agent.
# The curator selects a NAME from this file. It never writes raw parameters.
# Any name the curator emits that isn't a key here is rejected, not coerced.
#
# Adapted from the trading_system MVP profiles to the trader's risk-gate
# vocabulary: confidence floors are in basis points (bps, 0..10000) to match
# RiskGate.min_confidence_bps and Signal.confidence_bps.

profiles:
  conservative:
    position_size_multiplier: 0.35
    confidence_floor_bps: 7500
    enabled_signals: ["funding_rate", "ml_funding_carry"]
    max_leverage: 1.5
    # Product B: Consensus thresholds per asset-class cohort
    consensus_thresholds:
      majors: 0.70
      alts: 0.80
      memecoins: 0.85
      tokenized_stocks: 0.75
    # Product B: Consensus behavior when threshold not met
    consensus_behavior: "skip"  # skip | reduced_size | default_trader | hold_and_log

  standard:
    position_size_multiplier: 0.65
    confidence_floor_bps: 6000
    enabled_signals: ["funding_persistence_z", "funding_rate", "ml_funding_carry"]
    max_leverage: 2.0
    consensus_thresholds:
      majors: 0.65
      alts: 0.75
      memecoins: 0.80
      tokenized_stocks: 0.70
    consensus_behavior: "skip"

  defensive:
    position_size_multiplier: 0.10
    confidence_floor_bps: 9000
    enabled_signals: []
    max_leverage: 1.0
    consensus_thresholds:
      majors: 0.75
      alts: 0.85
      memecoins: 0.90
      tokenized_stocks: 0.80
    consensus_behavior: "hold_and_log"

  # DBC Curve Profiles for Meteora integration
  dbc_flat:
    position_size_multiplier: 0.50
    confidence_floor_bps: 6500
    enabled_signals: ["dbc_curve"]
    max_leverage: 2.0
    consensus_thresholds:
      majors: 0.60
      alts: 0.70
      memecoins: 0.80
      tokenized_stocks: 0.70
    consensus_behavior: "skip"
    dbc_curve_type: "flat"
    dbc_fee_bps: 50
    dbc_graduation: 0.5

  dbc_exponential:
    position_size_multiplier: 0.45
    confidence_floor_bps: 7000
    enabled_signals: ["dbc_curve"]
    max_leverage: 1.8
    consensus_thresholds:
      majors: 0.55
      alts: 0.65
      memecoins: 0.75
      tokenized_stocks: 0.65
    consensus_behavior: "skip"
    dbc_curve_type: "exponential"
    dbc_fee_bps: 75
    dbc_graduation: 0.3

  dbc_long:
    position_size_multiplier: 0.55
    confidence_floor_bps: 6000
    enabled_signals: ["dbc_curve"]
    max_leverage: 2.5
    consensus_thresholds:
      majors: 0.65
      alts: 0.75
      memecoins: 0.85
      tokenized_stocks: 0.75
    consensus_behavior: "skip"
    dbc_curve_type: "long"
    dbc_fee_bps: 100
    dbc_graduation: 0.7

default_profile: standard

# Curator cannot switch more often than this (cooldown).
cooldown_cycles: 12

# If a switch underperforms the prior profile's trailing PnL over this many
# trades since the switch, auto-revert without waiting for a human.
auto_revert_lookback_trades: 8
auto_revert_threshold_pnl: -0.01   # revert if trailing PnL since switch < -1%

# Product B: Default consensus gate settings (overridden by active profile)
consensus_defaults:
  thresholds:
    majors: 0.65
    alts: 0.75
    memecoins: 0.80
    tokenized_stocks: 0.70
  behavior: "skip"
  default_trader: "funding_carry"  # fallback trader when consensus fails
